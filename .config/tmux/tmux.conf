# Prefix
#set -g prefix C-Space
#set -g prefix2 C-b
#bind C-Space send-prefix

unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
#bind -n M-Enter split-window -v -c "#{pane_current_path}"
#bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
#bind -n M-Escape kill-pane

#bind h split-window -v -c "#{pane_current_path}"
#bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

#bind '"' split-window -c "#{pane_current_path}"
#bind % split-window -h -c "#{pane_current_path}"
#bind c new-window -c "#{pane_current_path}"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

set -g base-index 1
setw -g pane-base-index 1

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
# Slow mouse-wheel scrolling from tmux's default 5 lines to 1 line per tick.
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -ag terminal-features "xterm-kitty:extkeys"
set -sg escape-time 10

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "

set -g window-status-format "#[fg=brightblack] #I:#W#[fg=colour40,bold]#F "
#set -g window-status-current-format "#[fg=blue,bold] #I:#W "

set -g window-status-current-format '#[bg=colour243] #[fg=colour50,bold]#I:#[fg=colour255,bold]#W#[fg=colour50]#F '
#set -g window-status-format '#[bg=colour238] #[fg=colour137,bold]#I:#[fg=colour252,bold]#W#[fg=colour40,bold]#F '

# Use heavier box-drawing characters so pane boundaries are easier to see.
set -g pane-border-lines heavy
set -g pane-border-style "fg=lightgreen"
set -g pane-active-border-style "fg=lightgreen"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

set -g set-clipboard on

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"

bind-key -n C-1 send-keys -l "\033[49;5u"
bind-key -n C-2 send-keys -l "\033[50;5u"
bind-key -n C-3 send-keys -l "\033[51;5u"
bind-key -n C-4 send-keys -l "\033[52;5u"
bind-key -n C-5 send-keys -l "\033[53;5u"
bind-key -n C-6 send-keys -l "\033[54;5u"
bind-key -n C-7 send-keys -l "\033[55;5u"
bind-key -n C-8 send-keys -l "\033[56;5u"
bind-key -n C-9 send-keys -l "\033[57;5u"
bind-key -n C-0 send-keys -l "\033[48;5u"


set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "


